version: 2
name: design-rdb-physical
description: 論理モデルと負荷・品質・基盤制約から、根拠と検証状態を持つRDB物理設計の正式な定義を新規作成する
inputs: [user_input, logical_document_path, database_product, database_version, requirements_document_path, workload_document_path, quality_document_path, architecture_document_path, evidence_paths, references, output_directory, name]

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

steps:
  - id: preflight-inputs
    script: scripts/input_paths.py
    purpose: 必須・任意の正式な定義のpathと証拠pathが絶対pathの通常fileとして読めることを設計前に検査する
    needs: [logical_document_path, requirements_document_path, workload_document_path, quality_document_path, architecture_document_path, evidence_paths, references]
    provides: [validated_input_paths]

  - id: settle-physical-inputs
    playbook: grill
    purpose: 答えでDBMS・版、整合性、容量、配置、保存先が変わる未決だけを利用者へ確かめる
    needs: [user_input, validated_input_paths, database_product, database_version, output_directory, name]
    provides: [decisions, open_questions]

  - id: ground
    agent_work: invoking_agent
    purpose: 入力を事実、合意済み決定、仮説、未確認、観測結果へ分け、物理判断との追跡を保持する
    needs: [validated_input_paths, decisions, open_questions]
    provides: [grounded_physical_inputs]

  - id: design-and-verify
    skill: physical-design
    purpose: 業務意味を保つ物理写像を設計し、論理指紋、上流根拠、検証状態を持つ本文を検査する
    needs: [grounded_physical_inputs, logical_document_path, database_product, database_version]
    provides: [physical_final_markdown, physical_validation_report, status]

  - id: document
    playbook: write-doc
    purpose: 検査済み本文をrdb-physical-design型で新規保存する
    input:
      document_type: rdb-physical-design
    needs: [physical_final_markdown, physical_validation_report, output_directory, name, references]
    provides: [physical_rdb_design_path]
